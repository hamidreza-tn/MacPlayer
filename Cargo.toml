[package]
name = "macplayer"
version = "1.10.2"
edition = "2024"
license = "MIT"
description = "A fast, native media player for macOS built with Rust, egui and libmpv"
repository = "https://github.com/hamidreza-tn/MacPlayer"

[dependencies]
arboard = "3.6.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "links", "accesskit"] }
egui = "0.36.2"
egui_glow = "0.36.2"
glow = "0.17.0"
libloading = "0.9.0"
rand = "0.10.3"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-media-player = "0.3"
block2 = "0.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[lints.rust]
# The no-unsafe rule is denied crate-wide; the C boundary files (src/ffi.rs,
# src/engine.rs, src/render.rs, src/value.rs and the getuid shim in
# src/main.rs) carry their own scoped `allow(unsafe_code)` annotations.
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
